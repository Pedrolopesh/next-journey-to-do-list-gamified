version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors are planned work, not automatic bumps
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # The Expo SDK and the native modules move together: update them on purpose with
      # `npx expo install --fix` and prove the iOS and Android builds, because a patch bump can break
      # the native build (expo 58.0.23 pulls an expo-modules-jsi that does not compile with Xcode 26.2).
      # Security updates are not affected by this list.
      - dependency-name: 'expo'
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'expo-*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@expo/*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'jest-expo'
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'react-native'
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'react-native-*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@react-native-google-signin/google-signin'
        update-types: [version-update:semver-minor, version-update:semver-patch]
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /apps/infra/docker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /apps/infra/compose
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

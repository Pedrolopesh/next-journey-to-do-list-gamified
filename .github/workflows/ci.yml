name: CI

on:
  pull_request:
    # edited: corrigir título ou descrição no GitHub refaz a checagem da descrição
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  # Editar título/descrição não pode cancelar a execução do código (grupos separados)
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'descricao' || 'codigo' }}
  cancel-in-progress: true

jobs:
  check:
    # editar título/descrição não precisa refazer build e testes
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # O Prisma 7 lê esta variável até para gerar o cliente; o valor aponta para o banco efêmero acima
      DATABASE_URL: postgresql://ci:ci-senha-descartavel@127.0.0.1:5432/nextjourney_test # scan-allow: credencial efêmera
      TEST_DATABASE_URL: postgresql://ci:ci-senha-descartavel@127.0.0.1:5432/nextjourney_test # scan-allow: credencial efêmera

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico inteiro: a checagem de commits e a varredura de segredos olham o intervalo do PR
          fetch-depth: 0

      # A versão do pnpm vem do campo packageManager do package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Postgres só para os testes e2e da API: o PostgreSQL que já vem instalado no runner (descartado ao fim
      # do job). Evita baixar imagem de container, que falha de vez em quando por limite de downloads.
      - name: Banco de teste (PostgreSQL do runner)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE ci WITH LOGIN SUPERUSER PASSWORD 'ci-senha-descartavel'" # scan-allow: credencial efêmera
          sudo -u postgres createdb -O ci nextjourney_test
          pg_isready -h 127.0.0.1 -p 5432 -d nextjourney_test -U ci

      # Só no PR: mensagens dos commits (Conventional Commits, sem corpo, sem atribuição a IA)
      # Dependabot writes its own commit bodies (release notes), which the rule would reject
      - name: Commits do PR
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash scripts/check-commits.sh

      - run: pnpm exec turbo run lint typecheck test build

      - name: Testes e2e da API
        run: pnpm --filter @nextjourney/api test:e2e

      - name: Propostas do OpenSpec alteradas no PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash scripts/check-openspec.sh

      - name: Código duplicado
        run: pnpm run duplicates

      - run: bash scripts/security-scan.sh

  # Descrição e título do PR no padrão do template (o texto vem por variável de ambiente, nunca
  # interpolado no script, para não permitir injeção de comando pelo título ou corpo)
  # Dependabot pull requests have a fixed generated description, so only people are held to the template
  descricao:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Título e descrição do PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          if ! printf '%s' "$PR_TITLE" | grep -E -q '^(feat|fix|chore|docs|refactor|perf|test|ci)(\([a-z0-9-]+\))?: [a-z0-9]'; then
            echo "Título fora do padrão: tipo(escopo opcional): assunto em minúscula"; fail=1
          fi
          for secao in "## O que muda" "## Por quê" "## Como foi verificado" "## Riscos e pendências" "## Segurança"; do
            printf '%s' "$PR_BODY" | grep -q "^$secao" || { echo "Falta a seção: $secao"; fail=1; }
          done
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -i -E -q 'co-authored-by:|generated with|claude-session:|claude\.ai/code/session'; then
            echo "O título e a descrição não podem citar ferramenta de IA nem co-autor"; fail=1
          fi
          [ "$fail" -eq 0 ]

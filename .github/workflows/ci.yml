name: CI

on:
  pull_request:
    # edited: fixing the title or description on GitHub reruns the description check
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  # Editing the title/description must not cancel the code run (separate groups)
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'description' || 'code' }}
  cancel-in-progress: true

jobs:
  check:
    # editing the title/description does not need a rebuild and tests
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Prisma 7 reads this variable even to generate the client; the value points to the ephemeral database above
      DATABASE_URL: postgresql://ci:ci-senha-descartavel@127.0.0.1:5432/nextjourney_test # scan-allow: ephemeral credential
      TEST_DATABASE_URL: postgresql://ci:ci-senha-descartavel@127.0.0.1:5432/nextjourney_test # scan-allow: ephemeral credential

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Whole history: the commit check and the secret scan look at the PR range
          fetch-depth: 0

      # The pnpm version comes from the packageManager field of package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Postgres only for the API e2e tests: the PostgreSQL already installed on the runner (discarded at the end
      # of the job). It avoids pulling a container image, which sometimes fails because of download limits.
      - name: Test database (runner PostgreSQL)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE ci WITH LOGIN SUPERUSER PASSWORD 'ci-senha-descartavel'" # scan-allow: ephemeral credential
          sudo -u postgres createdb -O ci nextjourney_test
          pg_isready -h 127.0.0.1 -p 5432 -d nextjourney_test -U ci

      # Only on a PR: commit messages (Conventional Commits, no body, no AI attribution)
      # Dependabot writes its own commit bodies (release notes), which the rule would reject
      - name: PR commits
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash scripts/check-commits.sh

      - run: pnpm exec turbo run lint typecheck test build

      - name: Testes e2e da API
        run: pnpm --filter @nextjourney/api test:e2e

      - name: Propostas do OpenSpec alteradas no PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash scripts/check-openspec.sh

      - name: Duplicated code
        run: pnpm run duplicates

      - run: bash scripts/security-scan.sh

  # PR title and description following the template (the text comes through an environment variable, never
  # interpolated into the script, so the title or body cannot inject commands)
  # Dependabot pull requests have a fixed generated description, so only people are held to the template
  descricao:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          if ! printf '%s' "$PR_TITLE" | grep -E -q '^(feat|fix|chore|docs|refactor|perf|test|ci)(\([a-z0-9-]+\))?: [a-z0-9]'; then
            echo "Title does not match: type(optional scope): lowercase subject"; fail=1
          fi
          for section in "## What changes" "## Why" "## How it was verified" "## Risks and pending items" "## Security"; do
            printf '%s' "$PR_BODY" | grep -q "^$section[[:space:]]*$" || { echo "Missing section: $section"; fail=1; }
          done
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -i -E -q 'co-authored-by:|generated with|claude-session:|claude\.ai/code/session'; then
            echo "The title and description must not mention an AI tool or a co-author"; fail=1
          fi
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -E -q '[áéíóúâêôãõç]'; then
            echo "The title and description must be in English (accented Portuguese characters found)"; fail=1
          fi
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -i -E -q 'leadership|lideran[cç]a|stakeholder'; then
            echo "The title and description must not cite who will review or evaluate the repository"; fail=1
          fi
          [ "$fail" -eq 0 ]

name: Delivery

# Builds the API images, scans them and, on main, publishes them signed to GHCR and releases them:
# dev automatically, production after a manual approval (protected environment).
on:
  pull_request:
    paths:
      - apps/api/**
      - packages/**
      - apps/infra/docker/**
      - pnpm-lock.yaml
      - .github/workflows/delivery.yml
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/**
      - apps/infra/docker/**
      - pnpm-lock.yaml
      - .github/workflows/delivery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/infra/docker/Dockerfile.api
          target: runtime
          load: true
          tags: nj-api:scan

      - name: Build the migrations image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/infra/docker/Dockerfile.api
          target: migrate
          load: true
          tags: nj-api-migrate:scan

      # Fails on fixable HIGH or CRITICAL findings. Exceptions live in .trivyignore with a reason and a review date.
      - name: Scan the runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nj-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: apps/infra/docker/.trivyignore

      - name: Scan the migrations image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nj-api-migrate:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: apps/infra/docker/.trivyignore

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (OIDC identity of this workflow)
    outputs:
      tag: ${{ steps.ids.outputs.tag }}
      api: ${{ steps.ids.outputs.api }}
      migrate: ${{ steps.ids.outputs.migrate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: names
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "api=${repo}/api" >> "$GITHUB_OUTPUT"
          echo "migrate=${repo}/api-migrate" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Push the runtime image
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/infra/docker/Dockerfile.api
          target: runtime
          push: true
          tags: ${{ steps.names.outputs.api }}:${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Push the migrations image
        id: migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/infra/docker/Dockerfile.api
          target: migrate
          push: true
          tags: ${{ steps.names.outputs.migrate }}:${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Image references by digest
        id: ids
        env:
          API: ${{ steps.names.outputs.api }}@${{ steps.api.outputs.digest }}
          MIGRATE: ${{ steps.names.outputs.migrate }}@${{ steps.migrate.outputs.digest }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          {
            echo "api=${API}"
            echo "migrate=${MIGRATE}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      # The exact images that were pushed are scanned; only clean ones get a signature, and the host
      # refuses unsigned images.
      - name: Scan the pushed runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.ids.outputs.api }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: apps/infra/docker/.trivyignore

      - name: Scan the pushed migrations image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.ids.outputs.migrate }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: apps/infra/docker/.trivyignore

      - name: SBOM of the runtime image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ids.outputs.api }}
          format: spdx-json
          output-file: sbom-api.spdx.json
          artifact-name: sbom-api.spdx.json

      - name: Sign the images and attach the SBOM
        env:
          API: ${{ steps.ids.outputs.api }}
          MIGRATE: ${{ steps.ids.outputs.migrate }}
        run: |
          cosign sign --yes "$API" "$MIGRATE"
          cosign attest --yes --type spdxjson --predicate sbom-api.spdx.json "$API"

  deploy-dev:
    needs: publish
    uses: ./.github/workflows/release.yml
    with:
      environment: dev
      env_name: dev
      tag: ${{ needs.publish.outputs.tag }}
      api: ${{ needs.publish.outputs.api }}
      migrate: ${{ needs.publish.outputs.migrate }}
    secrets: inherit

  deploy-prd:
    needs: [publish, deploy-dev]
    uses: ./.github/workflows/release.yml
    with:
      environment: production
      env_name: prd
      tag: ${{ needs.publish.outputs.tag }}
      api: ${{ needs.publish.outputs.api }}
      migrate: ${{ needs.publish.outputs.migrate }}
    secrets: inherit

packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  unrs-resolver: false

# Vulnerabilidades ALTAS aceitas de forma documentada (sem correção publicada pelo upstream).
# Ambas vêm só de ferramentas de desenvolvimento do Expo/Metro (CLI e empacotador), que rodam na
# máquina de dev e no CI e NÃO são embutidas no app nem rodam em produção.
# Revisar em 2026-11-03 ou quando o Expo publicar versão com a correção. Detalhes: docs/SEGURANCA.md.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge (via @expo/code-signing-certificates)
    - GHSA-vfj7-8cjw-p6xm # braces (via metro / micromatch)

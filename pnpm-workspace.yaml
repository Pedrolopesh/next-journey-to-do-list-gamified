packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # Install scripts skipped on purpose: the binaries come from the per-platform optional packages.
  esbuild: false
  unrs-resolver: false
  argon2: false
  '@swc/core': false
  '@parcel/watcher': false
  # OpenSpec CLI (proposal validation): works without the install script
  '@fission-ai/openspec': false
  # Third-party telemetry: never
  '@scarf/scarf': false
  # They must run: they download the Prisma migration engine
  prisma: true
  '@prisma/engines': true

# HIGH vulnerabilities accepted on purpose (no fix published upstream).
# All of them come only from Expo/Metro development tools (CLI and bundler), which run on the
# dev machine and in CI and are NOT embedded in the app nor run in production.
# Review on 2026-11-03 or when Expo publishes a version with the fix.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge (via @expo/code-signing-certificates)
    - GHSA-vfj7-8cjw-p6xm # braces (via metro / micromatch)
    - GHSA-mrhx-c7xc-m3w5 # zod 3.x bundled in @expo/cli (3.x got no fix; the project uses the fixed zod 4)

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.11'
  - '@expo/schema-utils@58.0.2'
  - babel-preset-expo@58.0.17
  - expo-modules-core@58.0.22
  - expo-modules-jsi@58.0.15
  - expo@58.0.14
  - '@expo/ui@58.0.20'
  - expo-application@58.1.2
  - expo-crypto@58.0.7
  - expo-dev-client@58.0.14
  - expo-dev-launcher@58.0.14
  - expo-haptics@58.0.7
  - expo-notifications@58.1.5
  - expo-router@58.0.23
  - expo-splash-screen@58.0.10

# Fixes for vulnerabilities in transitive dependencies of the Prisma CLI (development tooling only).
overrides:
  mysql2: '>=3.23.1'
  deepmerge-ts: '>=8.0.0'
  # Fixes for development tooling (Expo and Vite) with a published fixed version
  esbuild: '>=0.28.1'
  uuid: '>=11.1.1'
  decode-uri-component: '>=0.5.0'
  # DoS fixes with a published fixed version (Express/Nest and HTTP client)
  body-parser: '>=2.4.0'
  multer: '>=2.5.0'
  undici: '>=8.12.2'
  fast-uri: '>=3.1.9'
  # Query string parser used by the API's test client (supertest)
  qs: '>=6.16.1'
  # Expo CLI validates its own config with Zod 3; the fixed release is on the 4.x line
  '@expo/cli>zod': '>=4.6.6'
  # Fixes for high-severity advisories in transitive dependencies (Expo tooling and HTTP client)
  node-forge: '>=1.4.1'
  follow-redirects: '>=1.16.2'

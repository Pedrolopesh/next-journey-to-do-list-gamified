packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # Scripts de instalação ignorados de propósito: os binários vêm dos pacotes opcionais por plataforma.
  esbuild: false
  unrs-resolver: false
  argon2: false
  '@swc/core': false
  '@parcel/watcher': false
  # CLI do OpenSpec (validação das propostas): funciona sem o script de instalação
  '@fission-ai/openspec': false
  # Telemetria de terceiros: nunca
  '@scarf/scarf': false
  # Precisam rodar: baixam o motor de migrations do Prisma
  prisma: true
  '@prisma/engines': true

# Vulnerabilidades ALTAS aceitas de forma documentada (sem correção publicada pelo upstream).
# Todas vêm só de ferramentas de desenvolvimento do Expo/Metro (CLI e empacotador), que rodam na
# máquina de dev e no CI e NÃO são embutidas no app nem rodam em produção.
# Revisar em 2026-11-03 ou quando o Expo publicar versão com a correção. Detalhes: docs/SEGURANCA.md.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge (via @expo/code-signing-certificates)
    - GHSA-vfj7-8cjw-p6xm # braces (via metro / micromatch)
    - GHSA-mrhx-c7xc-m3w5 # zod 3.x embutido no @expo/cli (a 3.x não recebeu correção; o projeto usa zod 4 corrigido)

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.11'
  - '@expo/schema-utils@58.0.2'
  - babel-preset-expo@58.0.17
  - expo-modules-core@58.0.22
  - expo-modules-jsi@58.0.15
  - expo@58.0.14
  - '@expo/ui@58.0.20'
  - expo-application@58.1.2
  - expo-crypto@58.0.7
  - expo-dev-client@58.0.14
  - expo-dev-launcher@58.0.14
  - expo-haptics@58.0.7
  - expo-notifications@58.1.5
  - expo-router@58.0.23
  - expo-splash-screen@58.0.10

# Correções de vulnerabilidades em dependências transitivas do CLI do Prisma (só ferramenta de desenvolvimento).
overrides:
  mysql2: '>=3.23.1'
  deepmerge-ts: '>=8.0.0'
  # Correções de ferramentas de desenvolvimento (Expo e Vite) com versão corrigida publicada
  esbuild: '>=0.28.1'
  uuid: '>=11.1.1'
  decode-uri-component: '>=0.5.0'
  # Correções de DoS com versão corrigida publicada (Express/Nest e cliente HTTP)
  body-parser: '>=2.4.0'
  multer: '>=2.5.0'
  undici: '>=8.12.2'
  fast-uri: '>=3.1.9'
  # Query string parser used by the API's test client (supertest)
  qs: '>=6.16.1'
  # Expo CLI validates its own config with Zod 3; the fixed release is on the 4.x line
  '@expo/cli>zod': '>=4.6.6'
  # Fixes for high-severity advisories in transitive dependencies (Expo tooling and HTTP client)
  node-forge: '>=1.4.1'
  follow-redirects: '>=1.16.2'

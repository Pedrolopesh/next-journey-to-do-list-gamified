schema: spec-driven

# Deliberadamente CURTO. A fonte de verdade sobre stack, arquitetura, regras de
# implementação e checklist de segurança é o AGENTS.md, na raiz do repositório.
# Duplicar aquilo aqui criaria duas fontes que divergem. Aqui fica só o que é
# específico do OpenSpec: idioma, fronteira do repositório e verificação.
context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Next Journey: to-do list gamificado (monorepo pnpm + Turborepo com API NestJS,
  banner Vite em WebView e app Expo). Leia o AGENTS.md na raiz ANTES de propor
  ou implementar qualquer mudança.

  FRONTEIRA DO REPOSITÓRIO
  packages/contracts (schemas Zod) é a única fonte dos contratos entre API, app e
  banner. Mudança em rota, schema ou mensagem do banner é mudança de contrato:
  atualize os três consumidores no mesmo change. O servidor decide a progressão
  (EXP, moedas, nível, capítulo, conquistas); o app não calcula EXP.

  VERIFICAÇÃO
  Um change só está pronto quando passam, localmente: pnpm run lint,
  pnpm run typecheck, pnpm run test, pnpm run build e pnpm run security.
  Toda proposta deve ter uma seção de segurança (dados expostos, autorização,
  segredos) seguindo o checklist do AGENTS.md.

rules:
  proposal:
    - Cite a fase e o passo do docs/PLAN_TODO_APP.md quando existir
    - Sempre declare o que está fora do escopo
  tasks:
    - Quebre em tarefas de no máximo 2 horas, com teste junto da regra nova

operations:
  archive:
    guidance:
      - Resuma o resultado do arquivamento antes de terminar

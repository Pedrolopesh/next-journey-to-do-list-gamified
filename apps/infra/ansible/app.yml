---
# Does not change SSH or the firewall, so it skips the guard.
- name: Application (Docker, secrets, units) and edge (nginx, TLS)
  hosts: nj
  become: true
  roles:
    - role: app
      tags: [app]
    - role: release
      tags: [release]
    - role: edge
      tags: [edge]
    - role: verify
      tags: [verify]

# Signs in with the test account (email and code) and goes through the onboarding (intro, goal,
# character, story and final questions).
# Variables: MAESTRO_EMAIL and MAESTRO_CODE (created by scripts/ui-tests.mjs).
# Tolerant of the device state: active session, half-done onboarding or the welcome screen.
appId: br.com.wetechhub.app.dev
---
- launchApp
# The bundle takes a while to load
- extendedWaitUntil:
    visible: 'Entrar com e-mail|Perfil(, tab.*)?|Pular introdução|Começar a aventura|O que você quer mudar.*|Escolha o seu personagem|Escolha sua história|Conquista desbloqueada!'
    timeout: 120000
- runFlow: ../subflows/onboarding.yaml
- runFlow:
    when:
      visible: 'Perfil(, tab.*)?'
    commands:
      - tapOn: 'Perfil(, tab.*)?'
      - scrollUntilVisible:
          element: 'Sair'
      - tapOn: 'Sair'
- extendedWaitUntil:
    visible: 'Entrar com e-mail'
    timeout: 30000
- tapOn: 'Entrar com e-mail'
- runFlow:
    file: ../subflows/tap-field.yaml
    env:
      FIELD: 'E-mail'
- inputText: ${MAESTRO_EMAIL}
# The button rises with the keyboard: no need to hide the keyboard before tapping
- tapOn: 'Enviar código'
- extendedWaitUntil:
    visible: 'Digite o código'
    timeout: 30000
# The code field already opens focused
- inputText: ${MAESTRO_CODE}
- tapOn: 'Confirmar'
# New account (tutorial not seen yet): the intro is the first screen; if there is a pending
# achievement, it shows on top of the tutorial (and only it)
- extendedWaitUntil:
    visible: 'Começar a aventura|Conquista desbloqueada!'
    timeout: 30000
- runFlow: ../subflows/onboarding.yaml
- extendedWaitUntil:
    visible: 'Olá.*'
    timeout: 30000
- extendedWaitUntil:
    notVisible: 'Conquista desbloqueada!'
    timeout: 3000

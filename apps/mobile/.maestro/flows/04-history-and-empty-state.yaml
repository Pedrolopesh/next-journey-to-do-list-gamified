# A completed task goes to the history (Profile) and the notice shows in the Tasks footer;
# undoing from the history returns the task to the list; the row stays on screen until the screen is
# left, and the history is empty when reopened.
appId: br.com.wetechhub.app.dev
---
- runFlow: ../subflows/start.yaml
- tapOn: 'Tarefas(, tab.*)?'
- scrollUntilVisible:
    element: 'Tarefas concluídas saem desta lista e ficam no histórico, em Perfil.'
- assertVisible: 'Tarefas concluídas saem desta lista e ficam no histórico, em Perfil.'
- tapOn: 'Perfil(, tab.*)?'
- tapOn: 'Histórico de tarefas'
- assertVisible: '.*Pagar a conta de luz.*'
- tapOn: 'Concluída: toque para desmarcar'
- runFlow: ../subflows/back.yaml
- tapOn: 'Histórico de tarefas'
- assertVisible: 'Nada concluído ainda'
- assertVisible: 'Quando você concluir uma tarefa.*'

# Criar uma tarefa, marcar, ver o aviso de EXP e moedas e conferir que sai um modal por vez.
appId: br.com.wetechhub.app.dev
---
- runFlow: ../subflows/inicio.yaml
- tapOn: 'Tarefas(, tab.*)?'
- tapOn: 'Novo item'
- runFlow:
    file: ../subflows/tocar-campo.yaml
    env:
      CAMPO: 'Título'
- inputText: 'Pagar a conta de luz'
- hideKeyboard
# Seletor de dificuldade com estrelas (Figma) e botão X para fechar
- assertVisible: 'Dificuldade'
- assertVisible: 'Fechar'
- assertVisible: '(Dificuldade: )?Médio'
- tapOn: '(Dificuldade: )?Fácil'
- tapOn: 'Criar item'
# Criar libera "Primeira tarefa": o modal aparece depois da criação, um só
- extendedWaitUntil:
    visible: 'Conquista desbloqueada!'
    timeout: 15000
- runFlow: ../subflows/fechar-conquista.yaml
- assertVisible: '.*Pagar a conta de luz.*'
# Marcar (dificuldade fácil): o servidor dá 5 de EXP e 1 moeda; o aviso e o modal vêm juntos,
# então o valor é conferido na API
- tapOn: 'Marcar Pagar a conta de luz'
- extendedWaitUntil:
    visible: '\+5 EXP.*moedas|Conquista desbloqueada!'
    timeout: 15000
- runFlow: ../subflows/fechar-conquista.yaml
- runScript:
    file: ../scripts/conferir-jogador.js
    env:
      EXP_TOTAL: '5'
      COINS: '1'

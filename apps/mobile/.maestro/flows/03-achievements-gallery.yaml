# Gallery: tracks, new goals (rhythm) and the detail of an achievement.
appId: br.com.wetechhub.app.dev
---
- runFlow: ../subflows/start.yaml
- tapOn: 'Perfil(, tab.*)?'
- tapOn: 'Conquistas'
# Title and counter are a single text; the account has 3 achievements (Primeiro passo, task and habit)
- assertVisible: 'Primeiros passos.*3/12'
# New rhythm goals, with the progress coming from the server
# Android reads the goal counter as text; on iOS the card is a single label, without the counter
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: '1/6'
- scrollUntilVisible:
    element: 'Chama de 5 dias.*'
- assertVisible: 'Chama de 5 dias.*'
- scrollUntilVisible:
    element: 'Dia perfeito.*'
- tapOn: 'Dia perfeito.*'
- assertVisible: 'Conclua todos os diários.*em 8 dias diferentes'
- assertVisible: '0 de 8'
# On Android there are two "Fechar" (the sheet backdrop and the button); the button is the one below the title
- tapOn:
    text: 'Fechar'
    below: 'Dia perfeito'
- scrollUntilVisible:
    element: 'Hábito de 100 dias.*'
- assertVisible: 'Hábito de 100 dias.*'
# back to the Profile
- runFlow: ../subflows/back.yaml

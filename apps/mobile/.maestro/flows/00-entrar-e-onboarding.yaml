# Entra com a conta de teste (e-mail e código) e passa pelo onboarding (introdução, meta,
# personagem, história e perguntas finais).
# Variáveis: MAESTRO_EMAIL e MAESTRO_CODE (criadas por scripts/ui-tests.mjs).
# Tolerante ao estado do aparelho: sessão ativa, onboarding pela metade ou tela de boas-vindas.
appId: br.com.wetechhub.app.dev
---
- launchApp
# O bundle leva um tempo para carregar
- extendedWaitUntil:
    visible: 'Entrar com e-mail|Perfil(, tab.*)?|Pular|Crie seu herói|O que você quer mudar.*|Comece rápido|Escolha sua história|Conquista desbloqueada!'
    timeout: 120000
- runFlow: ../subflows/onboarding.yaml
- runFlow:
    when:
      visible: 'Perfil(, tab.*)?'
    commands:
      - tapOn: 'Perfil(, tab.*)?'
      - scrollUntilVisible:
          element: 'Sair'
      - tapOn: 'Sair'
- extendedWaitUntil:
    visible: 'Entrar com e-mail'
    timeout: 30000
- tapOn: 'Entrar com e-mail'
- runFlow:
    file: ../subflows/tocar-campo.yaml
    env:
      CAMPO: 'E-mail'
- inputText: ${MAESTRO_EMAIL}
# O botão sobe com o teclado: não precisa esconder o teclado antes de tocar
- tapOn: 'Enviar código'
- extendedWaitUntil:
    visible: 'Digite o código'
    timeout: 30000
# O campo do código já abre com o foco
- inputText: ${MAESTRO_CODE}
- tapOn: 'Confirmar'
# Conta nova (tutorial ainda não visto): a introdução é a primeira tela; se houver uma conquista
# pendente, ela aparece por cima do tutorial (e só ela)
- extendedWaitUntil:
    visible: 'Crie seu herói|Conquista desbloqueada!'
    timeout: 30000
- runFlow: ../subflows/onboarding.yaml
- extendedWaitUntil:
    visible: 'Olá.*'
    timeout: 30000
- extendedWaitUntil:
    notVisible: 'Conquista desbloqueada!'
    timeout: 3000

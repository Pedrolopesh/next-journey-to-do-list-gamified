# Closes the achievement modal, if one is open, and checks that another did NOT open right after
# (rule: one achievement modal per action).
appId: br.com.wetechhub.app.dev
---
- runFlow:
    when:
      visible: 'Conquista desbloqueada!'
    commands:
      - tapOn: 'Continuar'
      - assertNotVisible: 'Conquista desbloqueada!'

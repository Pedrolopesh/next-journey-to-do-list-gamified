# Passa pelas telas de onboarding que estiverem abertas (tutorial, personagem e história). Seguro
# para chamar a qualquer momento: cada etapa só roda se a tela estiver visível.
appId: br.com.wetechhub.app.dev
---
- runFlow: fechar-conquista.yaml
- runFlow:
    when:
      visible: 'Pular'
    commands:
      - tapOn: 'Pular'
- runFlow: fechar-conquista.yaml
- runFlow:
    when:
      visible: 'Comece rápido'
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - scrollUntilVisible:
                element: 'Nome do personagem'
      # iOS: scrollUntilVisible não acha o rótulo do campo; rola a tela duas vezes
      - runFlow:
          when:
            platform: iOS
          commands:
            - scroll
            - scroll
      - runFlow:
          file: tocar-campo.yaml
          env:
            CAMPO: 'Nome do personagem'
      - inputText: 'Testadora'
      - hideKeyboard
      - runFlow:
          when:
            platform: Android
          commands:
            - scrollUntilVisible:
                element: 'Criar personagem'
      - runFlow:
          when:
            platform: iOS
          commands:
            - scroll
      - tapOn: 'Criar personagem'
- runFlow:
    when:
      visible: 'Escolha sua história'
    commands:
      - tapOn: 'Praia.*'
      - tapOn: 'Começar esta história'

# Goes through the onboarding screens that are open (intro, character, story and
# final questions: reminders, goal, age and gender). Safe to call at any time: each step only runs if the screen is
# visible.
appId: br.com.wetechhub.app.dev
---
- runFlow: close-achievement.yaml
# Intro: opens on the presentation and "Pular introdução" leads to the character looks
- runFlow:
    when:
      visible: 'Começar a aventura'
    commands:
      - tapOn: 'Começar a aventura'
- runFlow:
    when:
      visible: 'Suas tarefas viram uma aventura|Marque e ganhe recompensas|Escolha a sua jornada'
    commands:
      - tapOn: 'Pular introdução'
- runFlow: close-achievement.yaml
# Ready-made looks: "Pular" goes on to the name
- runFlow:
    when:
      visible: 'Escolha o seu personagem'
    commands:
      - tapOn: 'Pular'
- runFlow:
    when:
      visible: 'Qual é o nome do seu personagem?'
    commands:
      - runFlow:
          file: tap-field.yaml
          env:
            FIELD: 'Nome do personagem'
      - inputText: 'Testadora'
      - tapOn: 'Criar personagem'
- runFlow:
    when:
      visible: 'Escolha sua história'
    commands:
      - tapOn: 'Praia.*'
      - tapOn: 'Começar esta história'
- runFlow:
    when:
      visible: 'Quer receber lembretes?'
    commands:
      - tapOn: 'Agora não'
- runFlow:
    when:
      visible: 'O que você quer mudar.*'
    commands:
      - tapOn: 'Parar de procrastinar'
      - tapOn: 'Continuar'
- runFlow:
    when:
      visible: 'Qual é a sua idade?'
    commands:
      - tapOn: 'Pular'
- runFlow:
    when:
      visible: 'Como devemos nos referir a você?'
    commands:
      - tapOn: 'Pular'

# Passa pelas telas de onboarding que estiverem abertas (introdução, personagem, meta, história e
# perguntas finais). Seguro para chamar a qualquer momento: cada etapa só roda se a tela estiver
# visível.
appId: br.com.wetechhub.app.dev
---
- runFlow: fechar-conquista.yaml
# Introdução: abre na apresentação e "Pular introdução" leva aos looks do personagem
- runFlow:
    when:
      visible: 'Começar a aventura'
    commands:
      - tapOn: 'Começar a aventura'
- runFlow:
    when:
      visible: 'Suas tarefas viram uma aventura|Marque e ganhe recompensas|Escolha a sua jornada'
    commands:
      - tapOn: 'Pular introdução'
- runFlow: fechar-conquista.yaml
- runFlow:
    when:
      visible: 'O que você quer mudar.*'
    commands:
      - tapOn: 'Parar de procrastinar'
      - tapOn: 'Continuar'
# Looks prontos: "Pular" segue para o nome
- runFlow:
    when:
      visible: 'Escolha o seu personagem'
    commands:
      - tapOn: 'Pular'
- runFlow:
    when:
      visible: 'Qual é o nome do seu personagem?'
    commands:
      - runFlow:
          file: tocar-campo.yaml
          env:
            CAMPO: 'Nome do personagem'
      - inputText: 'Testadora'
      - tapOn: 'Criar personagem'
- runFlow:
    when:
      visible: 'Escolha sua história'
    commands:
      - tapOn: 'Praia.*'
      - tapOn: 'Começar esta história'
- runFlow:
    when:
      visible: 'Quer receber lembretes?'
    commands:
      - tapOn: 'Agora não'
- runFlow:
    when:
      visible: 'Qual é a sua idade?'
    commands:
      - tapOn: 'Pular'
- runFlow:
    when:
      visible: 'Como devemos nos referir a você?'
    commands:
      - tapOn: 'Pular'

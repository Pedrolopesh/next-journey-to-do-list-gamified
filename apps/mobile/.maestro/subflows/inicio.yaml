# Ponto de partida comum: fecha modal de conquista, formulário de item e telas internas
# (galeria, histórico) que uma execução anterior possa ter deixado abertos.
appId: br.com.wetechhub.app.dev
---
- runFlow: fechar-conquista.yaml
- runFlow: fechar-formulario.yaml
- runFlow:
    when:
      visible: 'Voltar'
    commands:
      # Android: o Voltar da tela fica coberto pelo botão de desenvolvimento, então usa o do sistema
      - runFlow: voltar.yaml

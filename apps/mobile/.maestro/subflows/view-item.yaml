# Makes sure a list item is on screen (variable ITEM, expression). On a small screen (1280 px
# Android emulator) the banner and the story card push the list below the fold.
appId: br.com.wetechhub.app.dev
---
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: ${ITEM}
          centerElement: true
- assertVisible: ${ITEM}

# Testes de interface do app (Maestro). Rode com `pnpm --filter @nextjourney/mobile test:ui`.
# The flows share the same account, so they run one at a time and in this order (see docs/TESTING.md).
flows:
  - flows/*
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - 00-sign-in-and-onboarding
    - 01-create-and-check-task
    - 02-uncheck-yellow-notice
    - 03-achievements-gallery
    - 04-history-and-empty-state
    - 05-legal-documents

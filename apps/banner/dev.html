<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next Journey — banner (debug)</title>
    <style>
      body {
        background: #12122a;
        color: #f1f5f9;
        font:
          14px/1.4 system-ui,
          sans-serif;
        padding: 16px;
        overflow: auto;
      }
      h1 {
        font-size: 16px;
        margin-bottom: 12px;
      }
      .panel {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
        align-items: center;
      }
      button {
        background: #7c3aed;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button.secondary {
        background: #334155;
      }
      input[type='range'] {
        width: 220px;
      }
      iframe {
        border: 1px solid #334155;
        width: 390px;
        height: 180px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <h1>Banner: painel de debug (protocolo v1)</h1>
    <iframe id="frame" src="/index.html" title="banner"></iframe>
    <div class="panel">
      <label
        >progress <input id="progress" type="range" min="0" max="1" step="0.01" value="0" />
        <output id="out">0.00</output></label
      >
    </div>
    <div class="panel">
      <button data-send="INIT">INIT</button>
      <button data-send="ITEM_CHECKED">ITEM_CHECKED</button>
      <button data-send="CHAPTER_COMPLETED">CHAPTER_COMPLETED</button>
      <button data-send="SET_TIME_OF_DAY" class="secondary">SET_TIME_OF_DAY</button>
      <button data-send="PAUSE" class="secondary">PAUSE</button>
      <button data-send="RESUME" class="secondary">RESUME</button>
      <button data-send="INVALID" class="secondary">mensagem inválida</button>
    </div>
    <pre id="log"></pre>
    <script type="module">
      const frame = document.getElementById('frame');
      const progress = document.getElementById('progress');
      const out = document.getElementById('out');
      const log = document.getElementById('log');
      const character = { skin: 'light', hair: 'short-brown', outfit: 'tunic-purple' };
      const p = () => Number(progress.value);
      const builders = {
        INIT: () => ({
          v: 1,
          type: 'INIT',
          payload: {
            scene: 'map',
            character,
            sceneKey: 'forest-1',
            progress: p(),
            timeOfDay: 'night',
          },
        }),
        ITEM_CHECKED: () => ({ v: 1, type: 'ITEM_CHECKED', payload: { progress: p() } }),
        CHAPTER_COMPLETED: () => ({
          v: 1,
          type: 'CHAPTER_COMPLETED',
          payload: { nextSceneKey: 'forest-2' },
        }),
        SET_TIME_OF_DAY: () => ({
          v: 1,
          type: 'SET_TIME_OF_DAY',
          payload: { timeOfDay: 'morning' },
        }),
        PAUSE: () => ({ v: 1, type: 'PAUSE' }),
        RESUME: () => ({ v: 1, type: 'RESUME' }),
        INVALID: () => ({ v: 1, type: 'ITEM_CHECKED', payload: { progress: 7 } }),
      };
      const write = (dir, data) => {
        log.textContent =
          `${dir} ${typeof data === 'string' ? data : JSON.stringify(data)}\n` + log.textContent;
      };
      progress.addEventListener('input', () => {
        out.textContent = p().toFixed(2);
      });
      document.querySelectorAll('[data-send]').forEach((button) => {
        button.addEventListener('click', () => {
          const message = builders[button.dataset.send]();
          write('app -> banner', message);
          frame.contentWindow.postMessage(message, '*');
        });
      });
      window.addEventListener('message', (event) => {
        if (event.source === frame.contentWindow) write('banner -> app', event.data);
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next Journey — banner (debug)</title>
    <style>
      body {
        background: #12122a;
        color: #f1f5f9;
        font:
          14px/1.4 system-ui,
          sans-serif;
        padding: 16px;
        overflow: auto;
      }
      h1 {
        font-size: 16px;
        margin-bottom: 12px;
      }
      .panel {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
        align-items: center;
      }
      button {
        background: #7c3aed;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button.secondary {
        background: #334155;
      }
      input[type='range'] {
        width: 220px;
      }
      iframe {
        border: 1px solid #334155;
        width: 390px;
        height: 180px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <h1>Banner: painel de debug</h1>
    <iframe id="frame" src="/index.html" title="banner"></iframe>
    <div class="panel">
      <label
        >progress <input id="progress" type="range" min="0" max="1" step="0.01" value="0" />
        <output id="out">0.00</output></label
      >
    </div>
    <div class="panel">
      <button id="run">ITEM_CHECKED (corrida de 5 s)</button>
      <button id="pause" class="secondary">PAUSE</button>
      <button id="resume" class="secondary">RESUME</button>
    </div>
    <script type="module">
      const frame = document.getElementById('frame');
      const progress = document.getElementById('progress');
      const out = document.getElementById('out');
      const scene = () => frame.contentWindow.__scene;
      progress.addEventListener('input', () => {
        out.textContent = Number(progress.value).toFixed(2);
        scene()?.setProgress(Number(progress.value));
      });
      document
        .getElementById('run')
        .addEventListener('click', () => scene()?.run(Number(progress.value)));
      document.getElementById('pause').addEventListener('click', () => scene()?.pause());
      document.getElementById('resume').addEventListener('click', () => scene()?.resume());
    </script>
  </body>
</html>

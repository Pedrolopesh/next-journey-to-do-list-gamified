# Local Postgres for development and tests. It is NOT the production infrastructure.
# The port is published on 127.0.0.1 only (Docker ignores the system firewall for published ports).
name: next-journey-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextjourney
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env (see .env.example)}
      POSTGRES_DB: nextjourney
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5544}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nextjourney -d nextjourney']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
